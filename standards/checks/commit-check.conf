# Values of the commit check (guidelines/core-principles.md, CORE-11 to CORE-14;
# guidelines/database-and-flyway.md, DB-11 and DB-12). Read by kit/scripts/check.sh.
# One KEY=value per line, no quotes; the file is parsed, never sourced. Patterns are POSIX
# extended regular expressions. Change a value here, not in check.sh. Status: draft.

# CORE-11: the header is <type>(<scope>)!: <subject>; the scope and the "!" are optional.
COMMIT_TYPES=feat|fix|refactor|perf|test|docs|build|ci|chore|revert
COMMIT_SCOPE=[a-z0-9-]+

# CORE-12: the longest header, in characters.
HEADER_MAX=72

# CORE-13: the longest body line, in characters. A line that holds "://" is exempt.
BODY_MAX=72

# CORE-11 to CORE-13: a header that this pattern matches is exempt; the squash merge removes it.
FIXUP_HEADER=^(fixup!|squash!|[Ww][Ii][Pp])

# DB-11, DB-12: the folder of the Flyway migrations (it may sit below any module), and the
# names that a new file in it may have.
MIGRATION_DIR=db/migration
MIGRATION_NAME=V[0-9]{12}__[a-z0-9_]+\.sql|R__[a-z0-9_]+\.sql
