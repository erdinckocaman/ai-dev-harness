# Values of the ArchUnit rules (guidelines/project-structure.md, STRUCT-1 to STRUCT-4, and the
# layers that ERR-7 and DB-21 name).
# Read by the ArchUnit runner of kit/checks/, which kit/scripts/check.sh starts.
# Change a value here, not in the code. Status: draft, like the guidelines.

# The layer packages. A class belongs to the layer of the first package segment below the base
# package (the package of the @SpringBootApplication class) that names a layer: both
# <base>.web.OrderController and <base>.invoice.web.InvoiceController are in "web".
layers=web,service,domain,repository,client,config

# STRUCT-2: the other layers that a layer may use. A layer always may use itself.
# Empty: no other layer. "*": every layer. Each layer of "layers" needs one line.
may-use.web=service,domain,config
may-use.service=domain,repository,client,config
may-use.repository=domain
may-use.client=domain,config
may-use.domain=
may-use.config=*

# STRUCT-3: the annotations (fully qualified, comma-separated) whose classes sit in a layer.
# Every subtype of a Spring Data repository interface also sits in "repository".
placement.web=org.springframework.web.bind.annotation.RestController,\
  org.springframework.stereotype.Controller,\
  org.springframework.web.bind.annotation.RestControllerAdvice
placement.service=org.springframework.stereotype.Service
placement.repository=org.springframework.stereotype.Repository
placement.domain=jakarta.persistence.Entity,jakarta.persistence.Embeddable,\
  javax.persistence.Entity,javax.persistence.Embeddable
placement.config=org.springframework.context.annotation.Configuration,\
  org.springframework.boot.context.properties.ConfigurationProperties

# The layers that other rules name. Each value is a layer of "layers"; a rename of a layer
# changes these values too, and no code.
# STRUCT-3: every subtype of a Spring Data repository interface sits in this layer.
layer.spring-data=repository
# ERR-7: classes in these layers do not use org.springframework.web.
layer.no-web=service,domain
# DB-21: @Transactional classes and methods sit in this layer.
layer.transactional=service
